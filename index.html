<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Gift Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
        .warning-container { margin-bottom: 30px; }
        .warning-text { font-size: 26px; font-weight: 800; color: #ff3b30; text-transform: uppercase; animation: pulse 2s infinite; line-height: 1.3; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        .gift-card { background: #1e1e1e; border: 3px solid #333333; border-radius: 24px; padding: 35px 25px; width: 100%; max-width: 340px; box-shadow: 0px 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; transition: all 0.4s ease; }
        .profile-pic { width: 160px; height: 160px; border-radius: 50%; border: 5px solid #00f2fe; object-fit: cover; margin-bottom: 22px; }
        .username { font-size: 24px; font-weight: 700; margin-bottom: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .gift-info { font-size: 18px; font-weight: 600; color: #ebd317; background: rgba(235, 211, 23, 0.15); padding: 10px 20px; border-radius: 50px; border: 1px solid rgba(235, 211, 23, 0.4); }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="warning-container"><h1 class="warning-text">Jangan Di Gift,<br>Nanti Fotomu Akan Muncul</h1></div>
    <div class="gift-card" id="giftCard">
        <img src="https://w3schools.com" alt="Avatar" class="profile-pic" id="userAvatar">
        <div class="username" id="userName">Menunggu Gift...</div>
        <div class="gift-info" id="giftDetail">Yuk ramaikan Live!</div>
    </div>
    <script>
        const socket = io();
        socket.on('giftEvent', (data) => {
            document.getElementById('userAvatar').src = data.profilePic;
            document.getElementById('userName').textContent = data.uniqueId;
            document.getElementById('giftDetail').textContent = `Thanks for ${data.repeatCount} x ${data.giftName}`;
            const card = document.getElementById('giftCard');
            card.style.borderColor = '#00f2fe';
            setTimeout(() => { card.style.borderColor = '#333333'; }, 800);
        });
    </script>
</body>
</html>
