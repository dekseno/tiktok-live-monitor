<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Gift Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            overflow: hidden;
        }

        .warning-container {
            margin-bottom: 30px;
            max-width: 90%;
        }

        .warning-text {
            font-size: 26px;
            font-weight: 800;
            color: #ff3b30;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0px 4px 12px rgba(255, 59, 48, 0.5);
            animation: pulse 2s infinite;
            line-height: 1.3;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .gift-card {
            background: #1e1e1e;
            border: 3px solid #333333;
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease-in-out;
        }

        .profile-pic {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid #00f2fe;
            object-fit: cover;
            margin-bottom: 22px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gift-info {
            font-size: 18px;
            font-weight: 600;
            color: #ebd317;
            background: rgba(235, 211, 23, 0.15);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(235, 211, 23, 0.4);
            display: inline-block;
        }
    </style>
    <!-- Menggunakan CDN untuk menangkap data TikTok langsung di browser -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="warning-container">
        <h1 class="warning-text">Jangan Di Gift,<br>Nanti Fotomu Akan Muncul</h1>
    </div>

    <div class="gift-card" id="giftCard">
        <img src="https://w3schools.com" alt="Avatar" class="profile-pic" id="userAvatar">
        <div class="username" id="userName">Menunggu Live...</div>
        <div class="gift-info" id="giftDetail">Koneksi Siap!</div>
    </div>

    <script>
        // GANTI dengan username TikTok Anda asli tanpa tanda @
        const TIKTOK_USERNAME = "korlapempat"; 

        const giftCard = document.getElementById('giftCard');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const giftDetail = document.getElementById('giftDetail');

        // Menghubungkan langsung dari Browser HP Anda ke TikTok Live
        const tiktokConnection = new TikTokLiveConnector(TIKTOK_USERNAME);

        tiktokConnection.connect().then(state => {
            userName.textContent = "Menunggu Gift...";
            giftDetail.textContent = "Sudah Terhubung!";
        }).catch(err => {
            userName.textContent = "Koneksi Gagal";
            giftDetail.textContent = "Cek Username Anda";
        });

        // Event saat menerima gift
        tiktokConnection.on('gift', (data) => {
            userAvatar.src = data.profilePictureUrl;
            userName.textContent = data.uniqueId;
            giftDetail.textContent = `Thanks for ${data.repeatCount} x ${data.giftName}`;
            
            // Efek animasi berkedip biru
            giftCard.style.borderColor = '#00f2fe';
            setTimeout(() => { 
                giftCard.style.borderColor = '#333333'; 
            }, 800);
        });
    </script>
</body>
</html>
